name: MATLAB CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: MATLAB unit and Pulseq smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true

      - name: Run tests
        uses: matlab-actions/run-command@v3
        with:
          command: run(fullfile(pwd,'tests','run_ci_tests.m'));

      - name: Upload MATLAB test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: matlab-junit-results
          path: artifacts/junit.xml
          if-no-files-found: error

# This workflow does not validate scanner-side SAR, PNS, RF safety, Siemens
# interpreter behavior, ICE reconstruction, or clinical use.
