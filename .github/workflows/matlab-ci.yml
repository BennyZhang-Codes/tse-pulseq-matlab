name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: MATLAB unit and Pulseq smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true

      - name: Run tests and collect coverage
        uses: matlab-actions/run-command@v3
        with:
          command: run(fullfile(pwd,'tests','run_ci_tests.m'));

      - name: Upload MATLAB test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: matlab-junit-results
          path: artifacts/junit.xml
          if-no-files-found: error

      - name: Upload MATLAB coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: matlab-coverage
          path: artifacts/coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: success()
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: artifacts/coverage.xml
          disable_search: true
          flags: matlab
          name: matlab-coverage
          fail_ci_if_error: false

# This workflow does not validate scanner-side SAR, PNS, RF safety, Siemens
# interpreter behavior, ICE reconstruction, or clinical use.
